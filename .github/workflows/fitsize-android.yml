name: FitSize build

# Builds an installable Android APK (debug-signed release build) on every
# push that touches the app, and uploads it as a workflow artifact so it can
# be downloaded straight onto a phone for testing. The iOS job compiles the
# iOS project without code signing to prove it builds; installing on an
# iPhone still needs Xcode + an Apple ID on a Mac.

on:
  push:
    branches: ['**']
    paths:
      - 'fitsize/**'
      - '.github/workflows/fitsize-android.yml'
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'Also compile the iOS app (no code signing) on a macOS runner'
        type: boolean
        default: false

concurrency:
  group: fitsize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitsize
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "fitsize-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: fitsize-android-apk
          path: fitsize/fitsize-*.apk
          retention-days: 30

  ios:
    name: iOS build (no signing)
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    runs-on: macos-latest
    defaults:
      run:
        working-directory: fitsize
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: fitsize-ios-unsigned-app
          path: fitsize/build/ios/iphoneos/Runner.app
          retention-days: 14
